[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-multiagent-sim"
version = "0.1.0"
description = "A multi-agent Python simulation where a shared grid environment adapts to collective agent performance, with modular policies, JSONL logging, and metrics visualization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "matplotlib~=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest~=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*"]
